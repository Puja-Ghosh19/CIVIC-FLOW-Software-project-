services:
  - type: web
    name: civic-flow-backend
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: CIVIC_FLOW_SECRET_KEY
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: civic_flow
      - key: CIVIC_FLOW_ADMIN_EMAIL
        sync: false
      - key: CIVIC_FLOW_ADMIN_PASSWORD
        sync: false
      - key: UPLOAD_DIR
        value: /var/data/uploads
    disk:
      name: civic-flow-uploads
      mountPath: /var/data
      sizeGB: 1
